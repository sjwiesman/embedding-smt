services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  materialize:
    image: materialize/materialized:v26.27.0
    ports:
      - "6875:6875"
      - "6876:6876"
      - "6877:6877"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  embeddings-mock:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python", "mock_openai_embeddings.py"]
    volumes:
      - ./mock-embeddings:/app:ro
    ports:
      - "8000:8000"

  connect:
    build:
      context: ..
      dockerfile: example/connect/Dockerfile
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_GROUP_ID: embedding-diff-example
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://redpanda:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: "8083"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/usr/share/local-connect-plugins
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
    ports:
      - "8083:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  materialize-init:
    image: postgres:16-alpine
    working_dir: /scripts
    command: ["sh", "bootstrap-materialize.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./materialize:/materialize:ro
    depends_on:
      redpanda:
        condition: service_healthy
      materialize:
        condition: service_started

  connect-init:
    image: curlimages/curl:8.9.1
    working_dir: /scripts
    command: ["sh", "register-connector.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./connect:/connect:ro
    depends_on:
      connect:
        condition: service_started
      materialize-init:
        condition: service_completed_successfully

  demo-runner:
    image: postgres:16-alpine
    working_dir: /scripts
    command: ["sh", "run-demo.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./materialize:/materialize:ro
    depends_on:
      connect-init:
        condition: service_completed_successfully

  verify:
    image: python:3.12-alpine
    working_dir: /scripts
    command: ["python", "verify_demo.py"]
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      demo-runner:
        condition: service_started
