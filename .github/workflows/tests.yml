name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # google-java-format 1.35.0 (pinned for local JDK 26+) reaches for javac internals
  # absent in older JDKs, so the formatting check runs on a newer JDK than the build
  # (which targets Java 11).
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check formatting
        run: mvn --batch-mode --no-transfer-progress spotless:check

  # Build and test on the deployment target (Java 11). `mvn package` does not invoke
  # Spotless, so this stays on 11 to match maven.compiler.release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean package
